name: ci

# Offline CI: install pinned deps, lint, format-check, run tests and the offline
# smoke/verify scripts. No publishing, no deployment, no external network use at
# runtime (the engine runs on committed data/raw snapshots and synthetic fixtures).

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Pytest (offline)
        run: python -m pytest -q

      - name: Offline smoke demo
        run: PYTHONPATH=. python scripts/smoke_demo.py

      - name: Frozen walkthrough verification
        run: PYTHONPATH=. python scripts/verify_demo.py
